<title>한옥반점 · 예약하기</title>
<!-- reserve.hanokbanjeom.com → https://hanokbanjeom.com/reserve
     2026-09-30 재아: 서브도메인을 https 로 쓰려고 GitHub Pages 에 넘기기 전용 장만 둠(Namecheap 넘기기는 http 만 돼서).
     예약 자료는 전혀 없음. 원본·설명은 madang-kr/hanok 의 CLAUDE.md '서브도메인' -->
<script>
  (function(){
    var base = "https://hanokbanjeom.com/reserve", keepPath = false;
    var p = keepPath ? location.pathname.replace(/^\/+/, "") : "";
    location.replace(base + p + location.search + location.hash);   /* manage.hanokbanjeom.com/sos → …/manage/sos */
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://hanokbanjeom.com/reserve"></noscript>
